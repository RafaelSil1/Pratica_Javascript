<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cor Hexadecimal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="card">
        <header class="card-header">
            <h1>Gerador de Cor Hex</h1>
            <p>Clique no botão para gerar uma nova cor aleatória</p>
        </header>

        <!-- Caixa que exibirá a cor de fundo dinâmica -->
        <div class="color-display" id="colorDisplay">
            <span class="hex-code" id="hexCode">#3B82F6</span>
        </div>

        <div class="card-actions">
            <button class="btn btn-primary" id="generateBtn">Gerar Nova Cor</button>
            <button class="btn btn-secondary" id="copyBtn">Copiar Código</button>
        </div>

        <!-- Mensagem de feedback opcional para a cópia -->
        <span class="copy-feedback" id="copyFeedback">Copiado para a área de transferência!</span>
    </main>

    <script src="script.js"></script>

</body>
</html>
