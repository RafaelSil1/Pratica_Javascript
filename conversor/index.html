<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- ESSA TAG É OBRIGATÓRIA PARA CELULARES -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>
<body>

    <div class="card">
        <h2>Conversor USD ➔ BRL</h2>
        <p>Digite o valor em Dólar ($):</p>
        
        <input type="number" id="valor-dolar" placeholder="Ex: 50" step="0.01">
        <button id="btn-converter">Converter para Real</button>

        <div id="resultado">R$ 0,00</div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
